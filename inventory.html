<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is your book of spells</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <style>
        /* Import a classic literary serif font */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap');

        body {
            /* Warm, cream-colored paper background */
            background-color: #fcfaf2; 
            color: #2b2b2a;
            /* Using Lora for the body text (excellent for reading) */
            font-family: 'Lora', Georgia, serif;
            line-height: 1.8;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        /* The container acts like a single book page */
        .book-page {
            max-width: 650px;
            padding: 80px 50px;
            background-color: #fcfaf2;
            /* Subtle shadow to give depth like pages in a binding */
            box-shadow: inset 10px 0 20px rgba(0,0,0,0.02), -5px 0 15px rgba(0,0,0,0.03);
        }

        /* Running header at the top of a page */
        .running-header {
            text-align: center;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #767673;
            margin-bottom: 60px;
            border-bottom: 1px solid #e6e3d8;
            padding-bottom: 10px;
        }
        
        </style>
  </head>
  
  <body>
    <h1>Book of Spells  </h1>
    <ul>
  <li style="font-size: 24px;">Thunderstrike</li>
  <li style="font-size: 24px;">Fire sword</li>
  <li style="font-size: 24px;">Oranges</li>
</ul>
 <a href="wizard_adventurestart.html">

          padding: 5px 10px;

          background-color: #FFF8DC; 
          color: #DC143C; 
          border-radius: 0.25px;
          cursor: pointer;">
         Go Back?
        </button>
      </a>
  </body>
</html>
